<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KV260 · 三维重建</title>
<style>
body{margin:0;background:#101827;color:#e8eef8;font:15px system-ui}header{position:absolute;top:20px;left:24px;z-index:1}h1{font-size:22px;margin:0 0 10px}p{color:#9dafc9;margin:7px 0}button,label{display:inline-block;background:#263852;color:white;border:1px solid #415777;border-radius:7px;padding:8px;margin:5px 8px 0 0}canvas{width:100vw;height:100vh;display:block;touch-action:none}#info{position:absolute;bottom:20px;left:24px;white-space:pre-line;pointer-events:none}#error{color:#ffadad}input{vertical-align:middle}
</style>
<header><h1>KV260 · 三维重建</h1><p>左键旋转 · 滚轮缩放 · 右键 / Shift 拖动平移</p>
<button id="reset">复位视角</button><button id="download">下载 OBJ</button>
<label>颜色 <input id="color" type="color" value="#62c8bd"></label><p id="error"></p></header>
<canvas id="view"></canvas><div id="info"></div>
<script>
"use strict";
const model=/*MODEL_DATA*/null;
const canvas=document.getElementById('view'), info=document.getElementById('info');
try {
if(!model) throw Error('尚未嵌入模型，请通过 mesh.show() 生成网页');
const gl=canvas.getContext('webgl',{antialias:true,preserveDrawingBuffer:true});
if(!gl) throw Error('浏览器未启用 WebGL');
const vs=`attribute vec3 aPosition; attribute vec3 aNormal;
uniform vec2 angles; uniform vec2 pan; uniform float zoom; uniform float aspect;
varying vec3 normal;
vec3 rotate(vec3 p){float a=angles.x,b=angles.y;
 vec3 q=vec3(cos(a)*p.x+sin(a)*p.z,p.y,-sin(a)*p.x+cos(a)*p.z);
 return vec3(q.x,cos(b)*q.y-sin(b)*q.z,sin(b)*q.y+cos(b)*q.z);}
void main(){vec3 p=rotate(aPosition);normal=rotate(aNormal);
 gl_Position=vec4((p.x*zoom+pan.x)/aspect,p.y*zoom+pan.y,-p.z*0.4,1.0);}`;
const fs=`precision mediump float; varying vec3 normal;uniform vec3 color;
void main(){vec3 n=normalize(normal);if(!gl_FrontFacing)n=-n;
 float light=0.24+0.76*max(dot(n,normalize(vec3(-0.4,0.7,1.0))),0.0);
 float shine=pow(max(dot(n,normalize(vec3(-0.2,0.3,1.0))),0.0),40.0)*0.22;
 gl_FragColor=vec4(color*light+shine,1.0);}`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const points=model.points, faces=model.faces, lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
for(const p of points)for(let j=0;j<3;j++){lo[j]=Math.min(lo[j],p[j]);hi[j]=Math.max(hi[j],p[j]);}
const center=lo.map((v,j)=>(v+hi[j])/2), size=points.length?Math.max(...hi.map((v,j)=>v-lo[j]),1e-6):1;
const normals=new Float32Array(points.length*3);
for(const f of faces){const a=points[f[0]],b=points[f[1]],c=points[f[2]],u=b.map((v,j)=>v-a[j]),v=c.map((v,j)=>v-a[j]);
 const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
 for(const i of f)for(let j=0;j<3;j++)normals[i*3+j]+=n[j];}
for(let i=0;i<points.length;i++){const length=Math.hypot(...normals.subarray(i*3,i*3+3))||1;for(let j=0;j<3;j++)normals[i*3+j]/=length;}
// Expanded triangles avoid requiring OES_element_index_uint on older browsers.
const positions=new Float32Array(faces.length*9), ns=new Float32Array(faces.length*9);
let k=0;for(const f of faces)for(const i of f)for(let j=0;j<3;j++){positions[k]=(points[i][j]-center[j])*1.6/size;ns[k++]=normals[i*3+j];}
for(const [name,data] of [['aPosition',positions],['aNormal',ns]]){const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0);}
const uniforms={};for(const name of ['angles','pan','zoom','aspect','color'])uniforms[name]=gl.getUniformLocation(program,name);
let yaw=0.4,pitch=-0.25,zoom=1,pan=[0,0],drag=null;
function draw(){const ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*ratio);canvas.height=Math.round(innerHeight*ratio);
 gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(0.063,0.094,0.153,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);
 gl.uniform2f(uniforms.angles,yaw,pitch);gl.uniform2fv(uniforms.pan,pan);gl.uniform1f(uniforms.zoom,zoom);gl.uniform1f(uniforms.aspect,canvas.width/canvas.height);
 const hex=document.getElementById('color').value;gl.uniform3fv(uniforms.color,[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255));gl.drawArrays(gl.TRIANGLES,0,faces.length*3);
 canvas.dataset.view=JSON.stringify([yaw,pitch,zoom,...pan]);canvas.dataset.ready='true';}
canvas.oncontextmenu=e=>e.preventDefault();
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.pan){pan[0]+=dx/innerHeight*2;pan[1]-=dy/innerHeight*2;}else{yaw+=dx*0.008;pitch+=dy*0.008;}drag.x=e.clientX;drag.y=e.clientY;draw();};
canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(20,Math.max(0.05,zoom*Math.exp(-e.deltaY*0.001)));draw();},{passive:false});
document.getElementById('reset').onclick=()=>{yaw=0.4;pitch=-0.25;zoom=1;pan=[0,0];draw();};
document.getElementById('color').oninput=draw;window.onresize=draw;
document.getElementById('download').onclick=()=>{const lines=['# PYNQ Marching Cubes V2'];for(const p of points)lines.push('v '+p.join(' '));for(const f of faces)lines.push('f '+f.map(i=>i+1).join(' '));const url=URL.createObjectURL(new Blob([lines.join('\n')+'\n'],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download='model.obj';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
info.textContent=`${points.length.toLocaleString()} 顶点 · ${faces.length.toLocaleString()} 三角面\n计算后端：${model.timing.backend} · 总耗时 ${model.timing.total_s.toFixed(3)} s`+(faces.length?'':'\n此阈值没有等值面');draw();
}catch(e){document.getElementById('error').textContent=e.message;console.error(e);}
</script></html>
